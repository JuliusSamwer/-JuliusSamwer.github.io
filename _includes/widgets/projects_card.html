{% assign projects = site.projects | sort: "order" %}
<div class="my-3 bg-white shadow-sm rounded-xl" id="projects">
    <h6 class="p-3 mb-0 border-bottom border-gray">
        <i class="fas fa-flask"></i> Current Projects
        <a href="{{ 'projects' | relative_url }}">(view all <i class="fas fa-angle-double-right"></i>)</a>
    </h6>
    {% for item in projects %}
        {% include widgets/publication_item.html item=item hide_bottom_border=forloop.last first=false last=forloop.last %}
    {% endfor %}
</div>
