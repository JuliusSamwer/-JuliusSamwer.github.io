{% if site.data.profile.hobbies %}
<div class="my-3 bg-white shadow-sm rounded-xl">
    <h6 class="p-3 mb-0 border-bottom border-gray"><i class="fas fa-mountain-sun"></i> Outside the Lab</h6>
    <div class="d-flex flex-wrap px-3 py-3">
        {% for item in site.data.profile.hobbies %}
        <div class="mr-4 my-1"><i class="{{ item.icon }} text-muted mr-2"></i>{{ item.name }}</div>
        {% endfor %}
    </div>
</div>
{% endif %}
