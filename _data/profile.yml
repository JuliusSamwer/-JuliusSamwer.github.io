short_bio: >-
  <p>
    I am a senior at <a href="https://www.cornell.edu/" target="_blank">Cornell University</a>, double majoring in
    Computer Science and Physics. I work on robot learning in the
    GRILL lab with Prof. Kuan Fang, where I contributed to
    <a href="https://spatialdex.github.io/" target="_blank">SpatialDex</a>, a framework that learns
    bimanual dexterity from RGB-only human videos, and now lead a new project on motion-conditioned reinforcement learning.
  </p>
  <p>
    I am also interested in world models that plan over long horizons. As a Milstein Summer Research Fellow, I started
    <a href="/projects">Zeus</a>, a project that studies whether hierarchical abstractions in world models can
    <em>emerge</em> from planning pressure rather than being designed by hand.
  </p>
  <p>
    Before research I interned in machine learning and data science at Stratif AI, Entrix Energy and Marvel Fusion.
    I speak German, English and Spanish.
  </p>

