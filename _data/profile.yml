short_bio: >-
  <p>
    I am a senior at <a href="https://www.cornell.edu/" target="_blank">Cornell University</a>, majoring in
    Computer Science with minors in Physics and Math. I work on robot learning in the
    GRILL lab with Prof. Kuan Fang, where I contributed to
    <a href="https://spatialdex.github.io/" target="_blank">SpatialDex</a>, a framework that learns
    bimanual dexterity from RGB-only human videos, and now lead a project on motion-grounded reinforcement learning:
    a policy that learns to follow an object's reference trajectory from a demonstration.
  </p>
  <p>
    I am also interested in world models that plan over long horizons. As a Milstein Summer Research Fellow, I started
    <a href="https://github.com/JuliusSamwer/echo" target="_blank">ECHO</a>, a closed-loop hierarchical world model
    that feeds low-level planning error back to the high level, which more than doubled long-horizon success
    (0.38 → 0.87) in controlled experiments. This fall I am a TA for CS 4750 Foundations of Robotics.
  </p>
  <p>
    Before research I interned in machine learning and data science at Stratif AI, Entrix Energy and Marvel Fusion.
    In my free time I ski, play tennis and chess, go running and cycling, and spend time with friends.
  </p>

