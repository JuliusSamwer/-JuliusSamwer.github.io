research:
- org: GRILL Lab (Prof. Kuan Fang), Cornell University
  where: Ithaca, NY
  when: Mar. 2026 – present
  role: Undergraduate Researcher
  groups:
  - title: >-
      SpatialDex: 3D-grounded bimanual dexterity from RGB-only human videos
      (<a href="https://arxiv.org/abs/2610.29716" target="_blank">arXiv 2026</a>, under review at ICRA 2027)
    bullets:
    - Designed bimanual dexterous manipulation tasks for real-world evaluation of a VLM-based visuomotor policy pre-trained on human video.
    - Collected and processed 250 episodes of bimanual teleoperation data, and processed and annotated episodes for the training pipeline.
    - Evaluated models in simulation and on the real bimanual system against π0.5, GeoVLA and other baselines.
    - Maintained and debugged the dexterous-hand hardware stack (Tianji arms, Wuji hands, RGB-D camera setup), resolving control and teleoperation issues.
  - title: Motion-Grounded Reinforcement Learning (project lead, target IROS / CoRL 2027)
    bullets:
    - Leading a new project on leveraging object motion trajectories for goal-conditioned RL.
    - Designed the experiment and reward and stabilized training at scale on a GPU cluster, with the policy reaching about 80% task success.
    - This is the base for residual-RL fine-tuning, multi-task generalization and compositional task understanding.
- org: Milstein Summer Research Fellowship, Cornell University
  where: Ithaca, NY
  when: Jun. 2026 – present
  role: Independent researcher
  groups:
  - title: >-
      <a href="https://github.com/JuliusSamwer/echo" target="_blank">ECHO</a>, closed-loop hierarchical latent world models
    bullets:
    - Awarded the Junior Summer Fellowship for self-directed research on hierarchical latent world models.
    - Built a closed-loop hierarchical world model that feeds low-level planning error back to the high level.
    - Engineered a reachability signal and more than doubled long-horizon success (0.38 → 0.87) in controlled experiments.
